<h2>Dolgozók</h2>

<button type="button" class="btn btn-primary" (click)="startShowModal()">
  Dolgozó hozzáadása
</button>

@if (showModal) {
  <!-- Modal -->
  <div class="modal d-block" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="exampleModalLabel">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
          <button type="button" class="btn-close" aria-label="Close" (click)="startCloseModal()"></button>
        </div>
        <div class="modal-body">
          <form [formGroup]="empForm" (ngSubmit)="save()" id="empForm">
            
            @if(!addMode) {
              <div>
                <label for="" class="form-label">ID</label>
                <input type="text" class="form-control" formControlName="id" id="id" readonly>
              </div>
            }
            <div>
              <label for="" class="form-label">Név</label>
              <input type="text" class="form-control" formControlName="name" id="name">
            </div>
            <div>
              <label for="" class="form-label">Település</label>
              <input type="text" class="form-control" formControlName="city" id="city">
            </div>
            <div>
              <label for="" class="form-label">Fizetés</label>
              <input type="text" class="form-control" formControlName="salary" id="salary">
            </div>
            <div>
              <label for="" class="form-label">Beosztás</label>
              <select class="form-select" id="position" formControlName="positionId">
                @for(pos of positions ; track pos.id) {
                  <option value="{{pos.id}}">{{pos.name}}</option>
                }
              </select>
            </div>

          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="startCloseModal()">Close</button>
          <button type="submit" class="btn btn-primary" form="empForm" >Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop fade show"></div>
}

<div>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>#</th>
                <th>Név</th>
                <th>Település</th>
                <th>Fizetés</th>
            </tr>
        </thead>
        <tbody>
            @for( emp of employees ; track emp.id ) {
                <tr>
                    <td>{{emp.id}}</td>
                    <td>{{emp.name}}</td>
                    <td>{{emp.city}}</td>
                    <td>{{emp.salary}}</td>
                </tr>
            }
        </tbody>
    </table>
</div>
